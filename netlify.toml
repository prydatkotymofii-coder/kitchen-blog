# Налаштування публікації на Netlify.
# Перед кожним деплоєм Netlify запускає збірку: вона робить окрему сторінку
# для кожного рецепту та статті і оновлює sitemap.xml. Робити щось руками
# не потрібно - достатньо додати рецепт у файл з даними та зробити Sync Changes.

[build]
  command = "node scripts/build.js"
  publish = "."
